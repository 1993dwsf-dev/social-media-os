name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Standalone data and input-validation tests
        run: bun test tests/workbook.test.ts tests/record-validation.test.ts
      - name: Generate Convex types on ephemeral local CI backend
        run: bunx convex dev --once
      - name: Build
        run: bun run build
      - name: Security and regression tests
        run: bun test
